e(0)}.panel-body{border-top:1px solid var(--border);padding:20px 24px 24px}.two,.three{display:grid;gap:24px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.chart-title{font-weight:800;margin-bottom:12px}.bars{height:250px;display:flex;align-items:end;gap:3px;border:1px solid var(--border);border-radius:12px;padding:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 8%,var(--surface)),var(--surface))}.bar{background:var(--primary);min-width:4px;flex:1;border-radius:4px 4px 0 0}.bar.secondary{background:var(--cyan)}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}.rank{padding-top:4px}.rank-row{display:grid;grid-template-columns:minmax(120px,1fr) 3fr 45px;gap:10px;align-items:center;margin:14px 0}.track{height:9px;background:color-mix(in srgb,var(--muted) 15%,transparent);border-radius:20px}.fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:20px}.donut{width:150px;height:150px;border-radius:50%;margin:16px auto;display:grid;place-items:center;background:conic-gradient(var(--success) 0 78%,var(--danger) 78% 100%)}.donut span{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800}.health-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;border-bottom:1px solid var(--border);padding:14px 0}.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:99px;color:var(--success);background:color-mix(in srgb,var(--success) 15%,transparent)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--border)}th{color:var(--muted);font-size:12px}.pager{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:1050px){.nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.main{padding:24px 16px}.filters{top:76px}.header{paddin </style></head><body><header class="header"><div class="brand"><div class="logo">LT</div><div><b>La Trobe Content Distribution Hub</b><div class="muted">Cloud Based Applications — Assessment 3</div></div></div><button class="theme" id="theme">◐</button></header><div class="shell"><aside class="nav"><div class="eyebrow">Workspace</div><a>▦ Dashboard</a><a>▤ Posts</a><a>◉ Channels</a><a class="active">▥ Hub Intelligence</a><a>⌘ Workflow</a><a>◫ Database</a><a>ⓘ About</a><a>⚙ Settings</a></aside><main class="main"><div class="crumb">Dashboard　›　<b>Hub Intelligence</b></div><div class="headline"><div><div class="eyebrow">Assessment 3 analytics cockpit</div><h1>Hub Intelligence</h1><p class="muted">Live publishing, RSS and Channel intelligence.</p></div><button class="refresh" id="refresh">⌁ Refresh</button></div><section class="filters"><label><span>Time</span><div class="seg" id="time"></div></label><label><span>Publishing author</span><select class="field" data-filter="author"><option>All authors</option><option>Dr Emily Taylor</option><option>Prof Michael Chen</option><option>Dr Sarah Williams</option></select></label><label><span>RSS user</span><select class="field" data-filter="user"><option>All RSS users</option><option>Ava Nguyen</option><option>Liam Wilson</option><option>Mia Patel</option></select></label><label><span>Channel</span><select class="field" data-filter="channel"><option>All Channels</option><option>Cloud & DevOps</option><option>AI Coding</option><option>Cybersecurity</option></select></label><label><span>Request result</span><select class="field" data-filter="result"><option>All results</option><option>Successful</option><option>Failed</option></select></label><label><span>Source</span><select class="field" data-filter="source"><option>All sources</option><option>RSS client</option><option>JMeter</option><option>Manual</option></select></label></section><section class="kpis" id="kpis"></section><section id="dashboard"></section></main></div><script>
const NOW=new Date('2026-08-15T12:00:00Z'),authors=['Dr Emily Taylor','Prof Michael Chen','Dr Sarah Williams'],users=['Ava Nguyen','Liam Wilson','Mia Patel','Noah Brown'],channels=['Cloud & DevOps','AI Coding','Cybersecurity','Data & Analytics'],sources=['RSS client','JMeter','Manual'];const records=[];for(let d=0;d<92;d++){for(let n=0;n<3+(d%7);n++)records.push({date:new Date(NOW-((d*864e5)+(n*3600e3))),author:authors[(d+n)%3],user:users[(d+n)%4],channel:channels[(d*2+n)%4],source:sources[(d+n)%3],ok:(d+n)%11!==0,latency:8+(d*7+n*13)%70,posts:(d+n)%5===0})}let state={range:'7d',author:'All authors',user:'All RSS users',channel:'All Channels',result:'All results',source:'All sources',page:1};const ranges=['1h','24h','7d','30d','All'];function filtered(){let days={"1h":1/24,"24h":1,"7d":7,"30d":30,All:92}[state.range],cut=new Date(NOW-days*864e5);return records.filter(r=>r.date>=cut&&(state.author==='All authors'||r.author===state.author)&&(state.user==='All RSS users'||r.user===state.user)&&(state.channel==='All Channels'||r.channel===state.channel)&&(state.source==='All sources'||r.source===state.source)&&(state.result==='All results'||(state.result==='Successful')===r.ok))}function count(a,key){return a.reduce((x,r)=>(x[r[key]]=(x[r[key]]||0)+1,x),{})}function bar(title,vals,second){let max=Math.max(...vals.map(x=>x.v),1);return `<article><div class="chart-title">${title}</div><div class="bars">${vals.map((x,i)=>`<i class="bar" title="${x.label}: ${x.v}" style="height:${Math.max(3,x.v/max*100)}%"></i>${second?`<i class="bar secondary" title="${x.label}: ${x.s||0}" style="height:${Math.max(1,(x.s||0)/max*100)}%"></i>`:''}`).join('')}</div><div class="axis"><span>${vals[0]?.label||''}</span><span>${vals.at(-1)?.label||''}</span></div></article>`}function rank(title,map){let e=Object.entries(map).sort((a,b)=>b[1]-a[1]),max=e[0]?.[1]||1;return `<article><div class="chart-title">${title}</div><div class="rank">${e.map(([k,v])=>`<div class="rank-row"><b>${k}</b><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join('')}</div></article>`}function panel(title,body){return `<details class="panel" open><summary>${title}</summary><div class="panel-body">${body}</div></details>`}function daily(a){let map={};a.forEach(r=>{let k=r.date.toISOString().slice(0,10);map[k]=(map[k]||0)+1});return Object.entries(map).sort().map(([label,v])=>({label:label.slice(5),v}))}function render(){let a=filtered(),posts=a.filter(x=>x.posts),ok=a.filter(x=>x.ok),fails=a.filter(x=>!x.ok),days=daily(a),postDays=daily(posts),cum=0,cumReq=days.map(x=>({label:x.label,v:cum+=x.v}));cum=0;let cumPosts=postDays.map(x=>({label:x.label,v:cum+=x.v}));let k=[['RSS Posts',posts.length,'▤','Published posts in the selected reporting period.'],['RSS Requests',a.length,'◉','All RSS feed requests in the selected reporting period.'],['Success Rate',a.length?Math.round(ok.length/a.length*100)+'%':'100%','✓','Successful RSS requests divided by all RSS requests.'],['Latency',(a.reduce((s,x)=>s+x.latency,0)/(a.length||1)).toFixed(0)+' / 72 ms','⌁','Average and p95 response generation time.'],['Active RSS Users',new Set(a.map(x=>x.user)).size,'◌','Distinct student RSS identities that requested a feed.'],['Failed RSS Requests',fails.length,'△','RSS requests that failed.'],['Publishing Authors',new Set(posts.map(x=>x.author)).size,'◌','Authors with published posts.'],['Feed Health','7 / 8','◫','Healthy Channels out of all Channels.'],['Open Alerts',2,'△','Unresolved operational alerts.'],['Active Clients',new Set(a.map(x=>x.user+x.source)).size,'◉','Distinct browser and service client identities.']];document.querySelector('#kpis').innerHTML=k.map((x,i)=>`<article tabindex="0" class="kpi"><span class="icon" style="color:${['var(--primary)','var(--cyan)','var(--success)','var(--magenta)','var(--warning)','var(--danger)'][i%6]}">${x[2]}</span><small>${x[0]}</small><b>${x[1]}</b><span class="tip">${x[3]}</span></article>`).join('');let people=days.map(x=>({label:x.label,v:new Set(a.filter(r=>r.date.toISOString().slice(5,10)===x.label).map(r=>r.author)).size,s:new Set(a.filter(r=>r.date.toISOString().slice(5,10)===x.label).map(r=>r.user)).size}));document.querySelector('#dashboard').innerHTML=[panel('RSS performance',`<div class="two">${bar('RSS requests over time',days)}${bar('Request latency over time',days.map((x,i)=>({label:x.label,v:18+(i*11)%48})))}</div>`),panel('Publishing and audience',`<div class="two">${bar('Published posts over time',postDays)}${bar('Publishing authors and RSS users',people,true)}</div>`),panel('Cumulative growth',`<div class="two">${bar('Cumulative RSS requests',cumReq)}${bar('Cumulative published posts',cumPosts)}</div>`),panel('Distribution',`<div class="three"><article><div class="chart-title">RSS success vs failure</div><div class="donut"><span>${a.length?Math.round(ok.length/a.length*100):100}%</span></div></article><article><div class="chart-title">Published posts by Channel</div><div class="donut"><span>${posts.length}</span></div></article><article><div class="chart-title">Current feed health</div><div class="donut"><span>7/8</span></div></article></div>`),panel('RSS audience',`<div class="two">${rank('RSS requests by Channel',count(a,'channel'))}${rank('RSS requests by user',count(a,'user'))}</div>`),panel('Publishing output',`<div class="two">${rank('RSS posts by author',count(posts,'author'))}${rank('RSS posts by Channel',count(posts,'channel'))}</div>`),panel('Operational quality',`<div class="two">${rank('Requests by source',count(a,'source'))}${rank('Failed requests by Channel',count(fails,'channel'))}</div>`),panel('Feed health grid',channels.concat(['Frontier LLMs','Hackathons','Internships','CSIT News']).map((x,i)=>`<div class="health-row"><b>${x}</b><span class="muted">${i===7?'No observations':'Last check: '+(i+2)+' min ago · '+(12+i*3)+' ms'}</span><span class="badge">${i===7?'UNKNOWN':'HEALTHY'}</span></div>`).join('')),panel('Alerts','<div class="health-row"><b>AI Coding</b><span class="muted">High latency threshold breached</span><button class="refresh">Resolve</button></div><div class="health-row"><b>Cybersecurity</b><span class="muted">Recent request failure observed</span><button class="refresh">Resolve</button></div>'),panel('Filterable request log',`<table><thead><tr><th>Time</th><th>RSS user</th><th>Client</th><th>Channel</th><th>Result</th><th>Latency</th><th>Source</th></tr></thead><tbody>${a.sort((x,y)=>y.date-x.date).slice((state.page-1)*20,state.page*20).map(r=>`<tr><td>${r.date.toLocaleDateString('en-AU')} ${r.date.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})}</td><td>${r.user}</td><td>rss-client-${r.user.toLowerCase().replace(' ','-')}</td><td>${r.channel}</td><td style="color:${r.ok?'var(--success)':'var(--danger)'}">${r.ok?200:503}</td><td>${r.latency} ms</td><td>${r.source}</td></tr>`).join('')}</tbody></table><div class="pager"><button class="refresh" onclick="state.page=Math.max(1,state.page-1);render()">Previous</button><button class="refresh" onclick="state.page++;render()">Next</button></div>`)].join('')}document.querySelector('#time').innerHTML=ranges.map(x=>`<button class="${x===state.range?'on':''}" onclick="state.range='${x}';state.page=1;render()">${x}</button>`).join('')}document.querySelectorAll('[data-filter]').forEach(x=>x.onchange=e=>{state[e.target.dataset.filter]=e.target.value;state.page=1;render()});document.querySelector('#theme').onclick=()=>document.documentElement.toggleAttribute('data-theme');document.querySelector('#refresh').onclick=render;render();
</script></body></html>
