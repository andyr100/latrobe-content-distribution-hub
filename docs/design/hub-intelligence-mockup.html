<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub Intelligence — Designer Handoff</title><style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#181a30;--muted:#667087;--line:#dde1f0;--primary:#5546d9;--cyan:#0798ae;--good:#16805c;--bad:#c33c58;--soft:#eeecff}body.dark{--bg:#101120;--card:#1d1e35;--ink:#f6f5ff;--muted:#afb1c7;--line:#363852;--soft:#302b57}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.top{position:sticky;top:0;z-index:5;padding:18px max(22px,calc((100vw - 1500px)/2));background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.wrap{max-width:1500px;margin:auto;padding:28px 22px 80px}.filters{position:sticky;top:67px;z-index:4;background:color-mix(in srgb,var(--primary) 11%,var(--card));border:1px solid color-mix(in srgb,var(--primary) 34%,var(--line));border-radius:18px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:end}.filters label{display:grid;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}select,.seg button,.action{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px}.seg{display:flex;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:11px}.seg button{border:0;padding:8px 12px}.seg button.on{background:var(--primary);color:#fff}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px #2d296211}.kpi{padding:16px;position:relative}.kpi b{font-size:25px;display:block;margin-top:10px}.tip{visibility:hidden;position:absolute;z-index:3;left:10px;right:10px;top:calc(100% + 5px);background:var(--ink);color:var(--bg);padding:9px;border-radius:9px;font-size:12px;line-height:1.4}.kpi:hover .tip,.kpi:focus .tip{visibility:visible}.panel{margin-top:18px}.panel summary{cursor:pointer;padding:18px;font-size:18px;font-weight:800;list-style:none}.panel summary:after{content:'⌄';float:right}.panel[open] summary:after{transform:rotate(180deg);display:inline-block}.inside{border-top:1px solid var(--line);padding:18px}.pair,.trio{display:grid;gap:18px}.pair{grid-template-columns:repeat(2,1fr)}.trio{grid-template-columns:repeat(3,1fr)}h3{margin:0 0 10px;font-size:14px}.bars{height:210px;display:flex;align-items:end;gap:7px;padding:15px;background:var(--soft);border-radius:12px}.bars i{flex:1;background:var(--primary);border-radius:5px 5px 0 0;min-height:3px}.bars i:nth-child(2n){background:var(--cyan)}.rank div{display:flex;gap:10px;align-items:center;margin:12px 0}.rank span{width:38%;font-weight:700}.rank i{display:block;height:9px;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:20px}.donut{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--good) 0 66%,var(--bad) 66% 100%);margin:10px auto;position:relative}.donut:after{content:'100%';display:grid;place-items:center;position:absolute;inset:30px;background:var(--card);border-radius:50%;font-weight:800}.health div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.badge{color:var(--good);font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.pager{display:flex;justify-content:end;gap:8px;margin-top:15px}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.pair,.trio{grid-template-columns:1fr}.filters{top:60px}.top{position:sticky}}
</style></head><body><header class="top"><strong>La Trobe Content Distribution Hub · Hub Intelligence</strong><button class="action" onclick="document.body.classList.toggle('dark')">Toggle theme</button></header><main class="wrap"><h1>Hub Intelligence</h1><p style="color:var(--muted)">Interactive designer handoff · local mock data only</p><section class="filters"><label>Time <span class="seg" id="time"><button class="on">7d</button><button>1h</button><button>24h</button><button>30d</button><button>All</button></span></label><label>Publishing author<select><option>All authors</option><option>Dr Emily Taylor</option><option>Prof Michael Chen</option></select></label><label>RSS user<select><option>All RSS users</option><option>Ava Nguyen</option><option>Liam Wilson</option></select></label><label>Channel<select><option>All Channels</option><option>Cloud & DevOps</option><option>AI Coding</option></select></label><label>Request result<select><option>All results</option><option>Successful</option><option>Failed</option></select></label><label>Source<select><option>All sources</option><option>RSS client</option><option>JMeter</option></select></label></section><section class="kpis" id="kpis"></section><div id="panels"></div></main><script>
const labels=['RSS Posts','RSS Requests','Success Rate','Latency','Active RSS Users','Failed RSS Requests','Publishing Authors','Feed Health','Open Alerts','Active Clients'];const tips=['Published posts in the selected reporting period.','All RSS feed requests in the selected reporting period.','Successful requests divided by all requests.','Average and p95 response generation time.','Distinct student RSS identities requesting feeds.','RSS requests that failed.','Authors who published in the selected period.','Healthy Channels out of all Channels.','Unresolved operational alerts.','Distinct browser and service client identities.'];let multiplier=1;function bars(){return '<div class="bars">'+[40,70,48,92,66,82,58,100,73,45,86,62].map((n,i)=>`<i style="height:${Math.max(4,n*multiplier)}%" title="Bucket ${i+1}: ${n}"></i>`).join('')+'</div>'}function rank(names){return '<div class="rank">'+names.map((n,i)=>`<div><span>${n}</span><i style="width:${88-i*13}%"></i><b>${(42-i*5)*multiplier|0}</b></div>`).join('')+'</div>'}function panel(title,body){return `<details class="panel" open><summary>${title}</summary><div class="inside">${body}</div></details>`}function pair(a,b){return `<div class="pair"><article><h3>${a}</h3>${bars()}</article><article><h3>${b}</h3>${bars()}</article></div>`}function render(){document.querySelector('#kpis').innerHTML=labels.map((l,i)=>`<article tabindex="0" class="kpi"><span style="color:${['#5546d9','#0798ae','#16805c','#a03a9f','#a46108','#c33c58'][i%6]}">●</span><small>${l}</small><b>${i===2?'96.4%':i===3?'18 / 41 ms':i===7?'7 / 8':Math.round((i+2)*17*multiplier)}</b><span class="tip">${tips[i]}</span></article>`).join('');document.querySelector('#panels').innerHTML=[panel('RSS performance',pair('RSS requests over time','Request latency over time')),panel('Publishing and audience',pair('Published posts over time','Publishing authors and RSS users')),panel('Cumulative growth',pair('Cumulative RSS requests','Cumulative published posts')),panel('Distribution',`<div class="trio"><article><h3>RSS success vs failure</h3><div class="donut"></div></article><article><h3>Published posts by Channel</h3><div class="donut"></div></article><article><h3>Current feed health</h3><div class="donut"></div></article></div>`),panel('RSS audience',pair('RSS requests by Channel','RSS requests by user').replaceAll(bars(),rank(['Cloud & DevOps','AI Coding','Cybersecurity']))),panel('Publishing output',`<div class="pair"><article><h3>RSS posts by author</h3>${rank(['Dr Emily Taylor','Prof Michael Chen','Dr Sarah Williams'])}</article><article><h3>RSS posts by Channel</h3>${rank(['Cloud & DevOps','AI Coding','Data & Analytics'])}</article></div>`),panel('Operational quality',`<div class="pair"><article><h3>Requests by source</h3>${rank(['RSS client','JMeter','Manual'])}</article><article><h3>Failed requests by Channel</h3>${rank(['AI Coding','Cloud & DevOps','Cybersecurity'])}</article></div>`),panel('Feed health grid',`<div class="health">${['AI Coding','Cloud & DevOps','Cybersecurity','Data & Analytics'].map(x=>`<div><b>${x}</b><span>Last check: 2 min ago · 18 ms</span><span class="badge">HEALTHY</span></div>`).join('')}</div>`),panel('Alerts','<p>No unresolved alerts in this mock.</p>'),panel('Filterable request log',`<table><thead><tr><th>Time</th><th>RSS user</th><th>Channel</th><th>Result</th></tr></thead><tbody>${Array.from({length:5},(_,i)=>`<tr><td>Today ${10+i}:14</td><td>Ava Nguyen</td><td>Cloud & DevOps</td><td>200</td></tr>`).join('')}</tbody></table><div class="pager"><button class="action">Previous</button><button class="action">Next</button></div>`)].join('')}render();document.querySelectorAll('select').forEach(x=>x.onchange=()=>{multiplier=.65+Math.random()*.7;render()});document.querySelector('#time').onclick=e=>{if(e.target.tagName==='BUTTON'){document.querySelectorAll('#time button').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');multiplier=.65+Math.random()*.7;render()}};
</script></body></html>
