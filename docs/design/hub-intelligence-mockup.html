<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hub Intelligence mockup</title><style>:root{--b:#f4f6fb;--s:#fff;--t:#17182b;--m:#62677d;--p:#5546d9;--c:#0798ae;--l:#dfe1ef}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px Arial}.head{height:72px;padding:16px 32px;background:var(--s);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5;font-weight:bold}.shell{display:flex;max-width:1600px;margin:auto}.nav{width:240px;padding:26px 18px;border-right:1px solid var(--l);min-height:100vh}.nav p{padding:12px;border-radius:10px}.nav p:nth-child(5){background:var(--p);color:#fff}.main{padding:28px 40px;flex:1}.filters,.card,.panel{background:var(--s);border:1px solid var(--l);border-radius:18px}.filters{position:sticky;top:84px;z-index:4;padding:16px;display:flex;gap:12px;flex-wrap:wrap;background:#eeeaff}.filters label{font-size:11px;font-weight:bold;color:var(--m)}select,button{padding:9px;border:1px solid var(--l);border-radius:10px;background:var(--s)}.seg button.on{background:var(--p);color:white}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card{padding:16px;position:relative}.card b{display:block;font-size:24px;margin-top:9px}.tip{display:none;position:absolute;z-index:8;top:100%;left:4px;right:4px;padding:8px;background:#17182b;color:#fff;border-radius:8px}.card:hover .tip,.card:focus .tip{display:block}details{margin:20px 0}summary{padding:20px;font-size:19px;font-weight:bold;cursor:pointer}.inside{border-top:1px solid var(--l);padding:20px}.two,.three{display:grid;gap:20px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.bars{height:230px;display:flex;align-items:end;gap:3px;padding:16px;background:#f0effa;border-radius:12px}.bar{flex:1;background:var(--p);border-radius:4px 4px 0 0}.rank div{display:grid;grid-template-columns:130px 1fr 35px;gap:8px;margin:13px 0}.track{height:9px;background:#e3e2ef;border-radius:9px}.fill{height:9px;background:linear-gradient(90deg,var(--p),var(--c));border-radius:9px}.donut{width:140px;height:140px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#16805c 0 78%,#c33c58 78%)}.donut span{display:grid;place-items:center;width:82px;height:82px;border-radius:50%;background:var(--s);font-weight:bold}.health{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--l)}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--l)}@media(max-width:900px){.nav{display:none}.main{padding:20px}.kpis,.two,.three{grid-template-columns:1fr}}</style><body><header class="head">LT　La Trobe Content Distribution Hub　·　Hub Intelligence</header><div class="shell"><aside class="nav"><p>Dashboard</p><p>Posts</p><p>Channels</p><p>Hub Intelligence</p><p>Workflow</p><p>Database</p></aside><main class="main"><div class="muted">Dashboard › Hub Intelligence</div><h1>Hub Intelligence</h1><p>Live publishing, RSS and Channel intelligence.</p><section class="filters"><label>Time <span class="seg" id="time"></span></label><label>Author <select data="a"><option>All authors</option><option>Dr Emily Taylor</option></select></label><label>RSS user <select data="u"><option>All RSS users</option><option>Ava Nguyen</option></select></label><label>Channel <select data="c"><option>All Channels</option><option>Cloud & DevOps</option></select></label><label>Result <select data="ok"><option>All results</option><option>Successful</option><option>Failed</option></select></label></section><section class="kpis" id="kpis"></section><div id="dash"></div></main></div><script>
const N=new Date('2026-08-15'),U=['Ava Nguyen','Liam Wilson','Mia Patel'],A=['Dr Emily Taylor','Prof Michael Chen','Dr Sarah Williams'],C=['Cloud & DevOps','AI Coding','Cybersecurity'],R=[];for(let d=0;d<92;d++)for(let i=0;i<4+d%5;i++)R.push({d:new Date(N-d*864e5-i*36e5),u:U[(d+i)%3],a:A[(d+i)%3],c:C[(d+i)%3],ok:(d+i)%9>0,post:(d+i)%5===0,ms:12+(d*5+i*7)%55});let S={r:'7d',a:'All authors',u:'All RSS users',c:'All Channels',ok:'All results'};function F(){let x={'1h':1/24,'24h':1,'7d':7,'30d':30,All:92}[S.r];return R.filter(q=>q.d>=N-x*864e5&&(S.a==='All authors'||q.a===S.a)&&(S.u==='All RSS users'||q.u===S.u)&&(S.c==='All Channels'||q.c===S.c)&&(S.ok==='All results'||(S.ok==='Successful')===q.ok))}function G(a,k){return a.reduce((o,x)=>(o[x[k]]=(o[x[k]]||0)+1,o),{})}function bars(t,a){let m=Math.max(...a.map(x=>x[1]),1);return `<article><b>${t}</b><div class=bars>${a.map(x=>`<i class=bar title="${x[0]}: ${x[1]}" style="height:${x[1]/m*100}%"></i>`).join('')}</div></article>`}function rank(t,o){let e=Object.entries(o),m=Math.max(...e.map(x=>x[1]),1);return `<article><b>${t}</b><div class=rank>${e.map(x=>`<div><span>${x[0]}</span><span class=track><i class=fill style="width:${x[1]/m*100}%"></i></span><b>${x[1]}</b></div>`).join('')}</div></article>`}function P(t,b){return `<details class=panel open><summary>${t}</summary><div class=inside>${b}</div></details>`}function V(){let q=F(),p=q.filter(x=>x.post),ok=q.filter(x=>x.ok),bad=q.filter(x=>!x.ok),by={};q.forEach(x=>{let k=x.d.toISOString().slice(5,10);by[k]=(by[k]||0)+1});let D=Object.entries(by);let cards=[['RSS Posts',p.length],['RSS Requests',q.length],['Success Rate',Math.round(ok.length/(q.length||1)*100)+'%'],['Latency','31 / 65 ms'],['Active RSS Users',new Set(q.map(x=>x.u)).size],['Failed RSS Requests',bad.length],['Publishing Authors',new Set(p.map(x=>x.a)).size],['Feed Health','7 / 8'],['Open Alerts',2],['Active Clients',new Set(q.map(x=>x.u+x.c)).size]];kpis.innerHTML=cards.map((x,i)=>`<article class=card tabindex=0><small>${x[0]}</small><b>${x[1]}</b><span class=tip>${x[0]} uses filtered synthetic records from the preceding three months.</span></article>`).join('');dash.innerHTML=[P('RSS performance',`<div class=two>${bars('RSS requests over time',D)}${bars('Request latency over time',D.map((x,i)=>[x[0],18+i%46]))}</div>`),P('Publishing and audience',`<div class=two>${bars('Published posts over time',D.map((x,i)=>[x[0],i%4]))}${bars('Publishing authors and RSS users',D.map((x,i)=>[x[0],1+i%3]))}</div>`),P('Cumulative growth',`<div class=two>${bars('Cumulative RSS requests',D.map((x,i)=>[x[0],D.slice(0,i+1).reduce((z,y)=>z+y[1],0)]))}${bars('Cumulative published posts',D.map((x,i)=>[x[0],i+1]))}</div>`),P('Distribution',`<div class=three>${['RSS success vs failure','Published posts by Channel','Current feed health'].map(x=>`<article><b>${x}</b><div class=donut><span>78%</span></div></article>`).join('')}</div>`),P('RSS audience',`<div class=two>${rank('RSS requests by Channel',G(q,'c'))}${rank('RSS requests by user',G(q,'u'))}</div>`),P('Publishing output',`<div class=two>${rank('RSS posts by author',G(p,'a'))}${rank('RSS posts by Channel',G(p,'c'))}</div>`),P('Operational quality',`<div class=two>${rank('Requests by source',{ 'RSS client':q.length-20,JMeter:20,Manual:8})}${rank('Failed requests by Channel',G(bad,'c'))}</div>`),P('Feed health grid',C.concat(['Data & Analytics','Frontier LLMs','Hackathons','Internships','CSIT News']).map((x,i)=>`<div class=health><b>${x}</b><span>Last check: ${i+2} min ago · ${12+i*3} ms</span><b>HEALTHY</b></div>`).join('')),P('Alerts','<div class=health><b>AI Coding</b><span>High latency threshold breached</span><button>Resolve</button></div>'),P('Filterable request log',`<table><tr><th>Time</th><th>RSS user</th><th>Channel</th><th>Result</th><th>Latency</th></tr>${q.slice(0,20).map(x=>`<tr><td>${x.d.toLocaleDateString()}</td><td>${x.u}</td><td>${x.c}</td><td>${x.ok?200:503}</td><td>${x.ms} ms</td></tr>`).join('')}</table>`)].join('');time.innerHTML=['1h','24h','7d','30d','All'].map(x=>`<button class="${x===S.r?'on':''}" onclick="S.r='${x}';V()">${x}</button>`).join('')}document.querySelectorAll('select').forEach(x=>x.onchange=e=>{S[e.target.getAttribute('data')]=e.target.value;V()});V();
</script>
