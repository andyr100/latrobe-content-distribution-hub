openapi: 3.1.0
info:
  title: La Trobe Content Distribution API
  version: 3.0.0
  description: Assessment 3 publishing, RSS, operational metrics, status, and alert contract.
servers:
  - url: http://localhost:4000
tags:
  - { name: Publishing }
  - { name: RSS }
  - { name: Operations }
  - { name: Hub Intelligence }
paths:
  /api/posts:
    get:
      tags: [Publishing]
      summary: List and filter posts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: authorId, in: query, schema: { type: string } }
        - { name: feedId, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Publishing]
      summary: Create a post and its feed relationships
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostInput" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/posts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      tags: [Publishing]
      summary: Read one post
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Publishing]
      summary: Update a post and optionally replace its feed relationships
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostInput" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Publishing]
      summary: Delete a post and cascade its join rows
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/feeds:
    get:
      tags: [Publishing]
      summary: Read the fixed feed catalogue
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/users:
    get:
      tags: [Publishing]
      summary: Read authors
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/rss-users:
    get:
      tags: [Hub Intelligence]
      summary: Read the six mock LMS student viewers
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/insights/filter-options:
    get:
      tags: [Hub Intelligence]
      summary: Read author, RSS student, Channel, source and range slicer options
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/insights/overview:
    get:
      tags: [Hub Intelligence]
      summary: Read filter-aware Hub Intelligence KPI and chart data
      parameters:
        - { $ref: "#/components/parameters/Range" }
        - { name: authorId, in: query, schema: { type: string } }
        - { name: rssUserId, in: query, schema: { type: string } }
        - { name: feedId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/insights/request-logs:
    get:
      tags: [Hub Intelligence]
      summary: Read paginated, filter-aware request-log evidence
      parameters:
        - { $ref: "#/components/parameters/Range" }
        - { name: authorId, in: query, schema: { type: string } }
        - { name: rssUserId, in: query, schema: { type: string } }
        - { name: feedId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [success, failure] } }
        - { name: source, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, enum: [20, 100, 500, 1000], default: 20 },
          }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /api/metrics/summary:
    get:
      tags: [Operations]
      summary: Read operational KPI totals
      parameters:
        - { $ref: "#/components/parameters/Range" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/metrics/requests-by-feed:
    get:
      tags: [Operations]
      summary: Aggregate requests and latency by feed
      parameters:
        - { $ref: "#/components/parameters/Range" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/metrics/requests-by-client:
    get:
      tags: [Operations]
      summary: Aggregate requests by stable client identity
      parameters:
        - { $ref: "#/components/parameters/Range" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/metrics/requests-over-time:
    get:
      tags: [Operations]
      summary: Return time-bucketed request activity
      parameters:
        - { $ref: "#/components/parameters/Range" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/metrics/recent:
    get:
      tags: [Operations]
      summary: Return recent persisted request records
      parameters:
        - { $ref: "#/components/parameters/Range" }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/feed-status:
    get:
      tags: [Operations]
      summary: Return the latest status event for every feed
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/alerts:
    get:
      tags: [Operations]
      summary: List alerts
      parameters:
        - { name: resolved, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /api/alerts/{id}:
    patch:
      tags: [Operations]
      summary: Resolve or reopen an alert
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolved]
              properties:
                resolved: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/NotFound" }
  /health:
    get:
      tags: [Operations]
      summary: Check API/database health, uptime, version, and feed count
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "503": { description: Database unavailable }
  /count:
    get:
      tags: [Operations]
      summary: Read the backwards-compatible successful RSS request count
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /stats:
    get:
      tags: [Operations]
      summary: Read publishing and RSS statistics
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /rss:
    get:
      tags: [RSS]
      summary: Read the five newest unique posts as RSS 2.0
      parameters:
        - { $ref: "#/components/parameters/ClientId" }
        - { $ref: "#/components/parameters/ClientSource" }
      responses:
        "200": { description: Combined RSS feed, content: { application/rss+xml: {} } }
  /rss/{channelCode}:
    get:
      tags: [RSS]
      summary: Read one Channel as RSS 2.0
      parameters:
        - {
            name: channelCode,
            in: path,
            required: true,
            schema: { type: string, example: CLOUDDEVOPS },
          }
        - { $ref: "#/components/parameters/ClientId" }
        - { $ref: "#/components/parameters/ClientSource" }
      responses:
        "200": { description: Channel RSS feed, content: { application/rss+xml: {} } }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    Range:
      name: range
      in: query
      schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
    ClientId:
      name: X-Client-Id
      in: header
      schema: { type: string, maxLength: 120 }
    ClientSource:
      name: X-Client-Source
      in: header
      schema: { type: string, maxLength: 80 }
  schemas:
    PostInput:
      type: object
      required: [title, body, authorId, feedIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        authorId: { type: string }
        feedIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        publishedAt: { type: string, format: date-time }
        imageUrl: { type: [string, "null"], format: uri }
        externalLink: { type: [string, "null"], format: uri }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: {}
        meta: { type: object }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Record was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
