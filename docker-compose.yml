services:
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unavailable}
        GIT_BRANCH: ${GIT_BRANCH:-main}
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  api:
    restart: unless-stopped
    build:
      context: ./api
    environment:
      DATABASE_STORAGE: /app/data/content-hub.sqlite
      APP_BASE_URL: http://localhost:4000
      FRONTEND_BASE_URL: http://localhost:3000
      RSS_SERVER_TITLE: La Trobe Content Distribution Hub
    ports:
      - "4000:4000"
    volumes:
      - sqlite-data:/app/data

  sqlite:
    restart: unless-stopped
    image: busybox:1.36.1
    command: ["sh", "-c", "echo 'SQLite data volume ready'; tail -f /dev/null"]
    volumes:
      - sqlite-data:/data
    healthcheck:
      test: ["CMD", "test", "-d", "/data"]
      interval: 30s
      timeout: 5s
      retries: 3

  rss-client:
    restart: unless-stopped
    build:
      context: ./rss-client
    environment:
      API_BASE_URL: http://api:4000
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sqlite-data:
