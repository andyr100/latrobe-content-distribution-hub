services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./api
    environment:
      DATABASE_STORAGE: /app/data/content-hub.sqlite
      APP_BASE_URL: http://localhost:4000
      FRONTEND_BASE_URL: http://localhost:3000
      RSS_SERVER_TITLE: La Trobe Content Distribution Hub
    ports:
      - "4000:4000"
    volumes:
      - sqlite-data:/app/data

  sqlite:
    image: busybox:1.36.1
    command: ["sh", "-c", "echo 'SQLite data volume ready'; tail -f /dev/null"]
    volumes:
      - sqlite-data:/data

  rss-client:
    build:
      context: ./rss-client
    environment:
      API_BASE_URL: http://api:4000
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite-data:
